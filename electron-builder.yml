appId: dev.unconfigured.admin-scaffold
productName: Admin Scaffold Development
executableName: admin-scaffold-development
asar: true
directories:
  output: release
files:
  - out/**
  - package.json
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
publish:
  provider: generic
  url: ${env.DESKTOP_UPDATE_BASE_URL}
