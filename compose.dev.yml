name: metabuilder-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: metabuilder
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d metabuilder"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - metabuilder-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:63799:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - metabuilder-redis-data:/data

volumes:
  metabuilder-postgres-data:
  metabuilder-redis-data:
